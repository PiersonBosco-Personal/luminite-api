name: Deploy API

on:
  push:
    branches: [deploy]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: luminite_test
          POSTGRES_USER: luminite
          POSTGRES_PASSWORD: secret
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U luminite"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql
      - run: composer install --no-interaction --prefer-dist --optimize-autoloader
      - run: cp .env.testing .env
      - run: php artisan key:generate
      - run: php artisan test
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: luminite_test
          DB_USERNAME: luminite
          DB_PASSWORD: secret

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: deploy
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: ENV_KEY
          script: |
            cd /var/www/luminite-api
            git fetch origin deploy
            git checkout deploy 2>/dev/null || git checkout -b deploy origin/deploy
            git pull origin deploy
            composer install --optimize-autoloader --no-interaction
            php artisan env:decrypt --env=production --key="$ENV_KEY" --filename=.env --force
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan queue:restart
            sudo supervisorctl restart luminite-reverb
        env:
          ENV_KEY: ${{ secrets.ENV_KEY }}
